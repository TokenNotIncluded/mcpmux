name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/e2e.py target/debug/mcpmux
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          export CC=musl-gcc
          host=$(rustc -vV | sed -n 's/^host: //p')
          linker="$(rustc --print sysroot)/lib/rustlib/$host/bin/rust-lld"
          cargo rustc --release --locked --target ${{ matrix.target }} -- -C linker="$linker" -C link-self-contained=yes -C target-feature=+crt-static
          if readelf -l target/${{ matrix.target }}/release/mcpmux | grep -q INTERP; then
            echo "Binary unexpectedly requires a dynamic loader" >&2
            exit 1
          fi
          python3 tests/e2e.py target/${{ matrix.target }}/release/mcpmux
          tar -C target/${{ matrix.target }}/release -czf mcpmux-${{ matrix.target }}.tar.gz mcpmux
          sha256sum mcpmux-${{ matrix.target }}.tar.gz > mcpmux-${{ matrix.target }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mcpmux-*.tar.gz
            mcpmux-*.sha256
