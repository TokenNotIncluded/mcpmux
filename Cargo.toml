[package]
name = "mcpmux"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Minimal authenticated path-routing MCP gateway"
repository = "https://github.com/tokennotincluded/mcpmux"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "process", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
subtle = "2"
url = "2"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies.tokio-util]
version = "0.7"
features = ["codec"]
